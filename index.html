<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a fast, honest coach; no fluff
IDEA: one index card on a desk, highlighter marks what matters
PICTURE: the live study card itself, large, at the top
COLOUR and TYPE: white paper, black ink, highlighter yellow, pencil blue; Schibsted Grotesk + JetBrains Mono
LAYOUT: drop box, the card, then tracks and the learner model */
:root{color-scheme:light dark;--bg:light-dark(#efefea,#111);--paper:light-dark(#fff,#1b1b1b);--ink:light-dark(#141414,#ececec);--mute:light-dark(#5d5d57,#a5a59d);--line:light-dark(#d9d9d2,#323232);--hl:#ffe14d;--blue:light-dark(#2453d6,#86a6ff);--bad:light-dark(#c62d1f,#ff7d6e);--good:light-dark(#17773f,#62d798)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Schibsted Grotesk",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:900px;margin:0 auto;padding:clamp(18px,3vw,40px) max(4vw,14px) 60px}
h1{font-size:clamp(32px,5vw,46px);line-height:1.05;margin:0;font-weight:800;letter-spacing:-.02em}
h1 mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit}
h2{font-size:24px;line-height:1.15;margin:0 0 8px}h3{font-size:16px;margin:18px 0 8px}
.sub{color:var(--mute);margin:6px 0 18px}
#stat{font-size:14px;color:var(--mute)}
.drop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin:0 0 8px}
textarea,input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea:focus,input:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
#src{min-height:48px;resize:vertical}
.pkg{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--paper);border:1.5px solid var(--hl);border-radius:10px;padding:8px 12px;margin:0 0 8px;font-size:15px}
.pkg[hidden]{display:none}
.btn{font:600 15px "Schibsted Grotesk",sans-serif;min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:wait}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.setup{margin:0 0 18px;font-size:15px}.setup summary{color:var(--mute);font-weight:600}
.bm{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:8px;background:var(--hl);color:#141414;font-weight:800;text-decoration:none;border:1.5px dashed #141414;cursor:grab}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,32px);box-shadow:0 1px 0 var(--line),0 18px 40px -28px #0006;min-height:340px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--mute);margin-bottom:10px}
.chip{font-weight:600;color:#141414;background:var(--hl);padding:2px 9px;border-radius:6px}
.chip.rev{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.tools select{width:auto;min-height:36px;padding:4px 8px;font-size:14px}
.primer{border-left:4px solid var(--hl);padding:2px 0 2px 14px;margin:12px 0 18px}
p{margin:0 0 10px}
code,pre,.code{font-family:"JetBrains Mono",monospace;font-size:14px}
code{background:light-dark(#f1f1ec,#262626);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
pre{overflow-x:auto;background:light-dark(#f4f4ef,#222);padding:12px;border-radius:10px;margin:0 0 10px}
pre code{background:none;padding:0}
.code{min-height:300px;line-height:1.5;tab-size:4;white-space:pre;overflow:auto}
#out{white-space:pre-wrap}#out:empty{display:none}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.q{border-top:1px solid var(--line);padding:14px 0}
.opt{display:block;width:100%;text-align:left;min-height:44px;margin:6px 0;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.why{color:var(--mute);font-size:15px}
.flash{border:1.5px dashed var(--line);border-radius:14px;padding:28px 22px;text-align:center;font-size:19px;min-height:150px;display:grid;place-items:center}
.res{border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
.score{font-size:34px;font-weight:800;line-height:1}
.dims{display:grid;grid-template-columns:8.5em minmax(0,1fr) 2.5em;gap:6px 10px;align-items:center;font-size:14px;margin:10px 0}
.dims .bar{margin:0;max-width:none}.dims span:last-child{text-align:right}
ul{margin:4px 0 10px;padding-left:20px}
.fb{margin-top:22px;border-top:2px solid var(--ink);padding-top:6px}
.pick{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:600 14px "Schibsted Grotesk";cursor:pointer}
.pick.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.r-again.on{background:var(--bad);border-color:var(--bad)}.r-easy.on{background:var(--good);border-color:var(--good)}
.mermaid-box{overflow-x:auto;margin:6px 0 14px;text-align:center}.mermaid-box svg{max-width:100%;height:auto}
figure{margin:14px 0;text-align:center}figure img,.reader img{max-width:100%;height:auto;border-radius:8px;background:#fff}
figcaption{font-size:14px;color:var(--mute);margin-top:4px}
.reader{font-size:17px;line-height:1.65}.reader h1,.reader h2,.reader h3{line-height:1.2;margin:22px 0 8px}.reader table{border-collapse:collapse;display:block;overflow-x:auto}.reader td,.reader th{border:1px solid var(--line);padding:4px 8px}
.reader blockquote{border-left:4px solid var(--line);margin:0 0 10px;padding-left:14px;color:var(--mute)}
details{margin:6px 0}summary{cursor:pointer;font-weight:600}
.timer{font:800 30px/1 "JetBrains Mono",monospace;margin:6px 0}.timer.late{color:var(--bad)}
.load{display:grid;place-items:center;min-height:280px;color:var(--mute);text-align:center}
.dots::after{content:"";animation:d 1.2s steps(4) infinite}@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none;content:"..."}}
.tracks{margin-top:30px}
.tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:14px 0;border-top:1px solid var(--line)}
.tr b{font-size:17px}.tr small{color:var(--mute);display:block}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px;max-width:320px}.bar i{display:block;height:100%;background:var(--ink)}
.trb{display:flex;gap:6px;align-items:start;flex-wrap:wrap;justify-content:end}
.model{margin-top:26px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:4px 16px}
.fs{display:grid;grid-template-columns:9em minmax(0,1fr) 3em;gap:8px;align-items:center;font-size:14px;margin:4px 0}
.fs span:last-child{text-align:right;color:var(--mute)}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}.top h1{font-size:32px}
.wrap{padding-bottom:150px}
#feed{display:flex;flex-direction:column;gap:14px}
.msg{max-width:min(640px,92%);padding:10px 14px;border-radius:14px;line-height:1.5}
.msg.t{background:var(--paper);border:1.5px solid var(--line);align-self:flex-start;border-top-left-radius:4px}
.msg.me{background:var(--ink);color:var(--paper);align-self:flex-end;border-top-right-radius:4px;white-space:pre-wrap}
.msg.done{background:transparent;border:1.5px dashed var(--line);color:var(--mute);font-size:14px;padding:6px 12px}
.msg p:last-child{margin:0}.msg .why{font-size:14px}
.msg.t .tr:first-of-type{border-top:0}
.composer{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);padding:22px max(4vw,14px) max(14px,env(safe-area-inset-bottom))}
.composer>*{max-width:900px;margin-inline:auto}
.cbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:end;background:var(--paper);border:1.5px solid var(--ink);border-radius:14px;padding:6px}
.cbar textarea{border:0;resize:none;max-height:180px;min-height:44px;padding:10px}
.cbar textarea:focus{outline:none}.cbar:focus-within{outline:3px solid var(--blue)}
.card{scroll-margin-top:12px}
.att{font-size:22px;padding:0 14px;border:0}
.msg.lib{max-width:100%;width:100%}
.cl{border-top:2px solid var(--ink);padding:12px 0 4px;margin-top:10px}
.cl h4{font-size:18px;margin:0 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it{padding:8px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
.it a{color:var(--ink);font-weight:600}.it small{color:var(--mute);display:block;font-size:13px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin:2px 4px 0 0;color:var(--mute)}
.tag.ov{border-color:var(--blue);color:var(--blue)}.tag.dup{border-color:var(--bad);color:var(--bad)}.tag.cov{border-color:var(--good);color:var(--good)}
.pr{width:9px;height:9px;border-radius:50%;background:var(--hl);display:inline-block;border:1.5px solid #141414}
body.drag .cbar{outline:3px dashed var(--blue)}
@media(max-width:600px){.drop{grid-template-columns:1fr}.tr{grid-template-columns:1fr}.trb{justify-content:start}.tools{margin-left:0}.dims{grid-template-columns:7em minmax(0,1fr) 2em}}

.ide{border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;margin:12px 0 0}
.ide .CodeMirror{height:auto;min-height:320px;max-height:70vh;font:14px/1.55 "JetBrains Mono",monospace;background:var(--paper);color:var(--ink)}
.ide .CodeMirror-scroll{min-height:320px;max-height:70vh}
.ide .CodeMirror-gutters{background:light-dark(#f4f4ef,#202020);border-right:1px solid var(--line)}
.ide .CodeMirror-linenumber{color:var(--mute)}.ide .CodeMirror-cursor{border-left:2px solid var(--ink)}
.ide .CodeMirror-selected{background:light-dark(#fff3a8,#4a4320)!important}
.ide .cm-keyword{color:light-dark(#8a1fa8,#d79bff)}.ide .cm-def{color:var(--blue);font-weight:600}.ide .cm-string{color:light-dark(#17773f,#7fdca2)}.ide .cm-number{color:light-dark(#b0480b,#ffb27a)}.ide .cm-comment{color:var(--mute);font-style:italic}.ide .cm-builtin,.ide .cm-variable-2{color:light-dark(#0d6f78,#7fd6de)}.ide .cm-operator{color:var(--ink)}
.ide textarea.code{border:0;border-radius:0;min-height:320px}
.tbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;background:light-dark(#f4f4ef,#202020);border-top:1.5px solid var(--ink)}
#tsum{font-weight:800}#tsum.ok{color:var(--good)}#tsum.no{color:var(--bad)}
.tests{margin:10px 0}.tt{border-top:1px solid var(--line);padding:6px 0;font-size:14px}
.tt b{display:inline-block;min-width:3.2em;font-size:12px;text-transform:none;border-radius:5px;padding:0 6px;margin-right:6px;text-align:center;color:#fff}
.tt.pass b{background:var(--good)}.tt.fail b{background:var(--bad)}.tt.wait b{background:var(--mute)}
.tt pre{margin:6px 0 0;font-size:13px;white-space:pre-wrap}
.ex{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}.ex td,.ex th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;font-family:"JetBrains Mono",monospace}.ex th{font-family:inherit}
.vz{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-top:10px;background:#fff}
.nudge{border-left:4px solid var(--blue);padding:4px 0 4px 12px;margin:10px 0}
.card.ws{padding:0;overflow:hidden}.card.ws .meta{padding:12px 16px;margin:0;border-bottom:1.5px solid var(--line)}
.wsf{display:block;width:100%;height:78vh;border:0;background:#fff}
.card.ws.full{position:fixed;inset:0;z-index:50;border-radius:0;margin:0}.card.ws.full .wsf{height:calc(100vh - 60px)}
.plan{margin:6px 0 0;padding-left:20px}.plan li{margin:4px 0}.plan .why{display:block}
</style></head><body>
<div class="wrap">
  <header class="top"><h1>Study <mark>Loop</mark></h1><span id="stat"></span></header>
  <main id="feed" aria-live="polite"></main>
</div>
<form class="composer" id="composer">
  <div class="pkg" id="pkg" hidden></div>
  <div class="cbar"><button type="button" class="btn ghost att" id="att" title="Import a list or file" aria-label="Import a list or file">+</button><input type="file" id="file" accept=".txt,.md,.csv,.tsv,.html,.htm,.json" hidden><textarea id="msg" rows="1" placeholder="Tell your teacher anything: “teach me DPO”, a paper link, a pasted blog, “too easy”, “skip”, “what am I learning?”"></textarea><button class="btn" id="send">Send</button></div>
</form>
<script type="text/plain" id="wsrc">
importScripts('https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js');
const ready=loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/'});
onmessage=async e=>{const d=e.data;try{const py=await ready;
  try{await py.loadPackagesFromImports(d.code+'\n'+d.tests.map(t=>t.code).join('\n')+'\n'+(d.viz||''))}catch(x){}
  py.globals.set('USER',d.code);py.globals.set('TESTS_JSON',JSON.stringify(d.tests));py.globals.set('VIZ',d.viz||'');
  postMessage({id:d.id,ok:true,res:JSON.parse(py.runPython(d.harness))})}catch(err){postMessage({id:d.id,ok:false,err:String(err&&err.message||err)})}};
</script>
<script type="text/plain" id="harness">
import sys, io, json, time, traceback
_res = {"setup": None, "tests": [], "stdout": "", "viz": None}
_ns = {"__name__": "__main__"}
_buf = io.StringIO(); _old = sys.stdout; sys.stdout = _buf
try:
    exec(compile(USER, "solution.py", "exec"), _ns)
except BaseException:
    _res["setup"] = traceback.format_exc()[-1500:]
for _t in json.loads(TESTS_JSON):
    _t0 = time.perf_counter()
    if _res["setup"]:
        _res["tests"].append({"name": _t["name"], "ok": False, "err": "Your code didn't run (see the error above).", "ms": 0}); continue
    try:
        exec(compile(_t["code"], "test", "exec"), dict(_ns))

/* ---------- library: import lists, organize in the background ---------- */
function parseList(text){
  const items=[],seen=new Set();
  const add=(title,url)=>{title=String(title||'').replace(/^\s*([-*•+]|\d+[.)])\s+/,'').replace(/^\[[ x]\]\s*/i,'').trim();url=String(url||'').trim();
    if(url&&!/^https?:/i.test(url))url='';const k=(url||title).toLowerCase().replace(/#.*$/,'').replace(/[?&]utm_[^&]*/g,'').replace(/\/$/,'');
    if(!k||k.length<3||seen.has(k)||/^(title|name|url|link)s?(,|\t|$)/i.test(title)&&!url)return;seen.add(k);items.push({title:title||url,url})};
  if(/<a\s[^>]*href/i.test(text)){new DOMParser().parseFromString(text,'text/html').querySelectorAll('a[href]').forEach(a=>add(a.textContent,a.getAttribute('href')));return items}
  if(/^\s*[\[{]/.test(text)){try{const walk=o=>{if(Array.isArray(o))o.forEach(walk);else if(o&&typeof o==='object'){const u=o.url||o.href||o.link||o.uri;if(u||((o.title||o.name)&&!o.children))add(o.title||o.name||'',u||'');Object.values(o).forEach(v=>{if(v&&typeof v==='object')walk(v)})}else if(typeof o==='string')add(o,'')};walk(JSON.parse(text));if(items.length)return items}catch(e){}}
  for(const line of text.split(/\r?\n/)){const l=line.trim();if(!l||/^#{1,6}\s/.test(l)&&!/https?:/.test(l)||/^[-=*_]{3,}$/.test(l))continue;
    const m=l.match(/\[([^\]]+)\]\((https?:[^)\s]+)\)/);if(m){add(m[1],m[2]);continue}
    const u=l.match(/https?:\/\/[^\s,"'<>)\]]+/);if(u){add(l.replace(u[0],'').replace(/["\t]/g,' ').replace(/^[\s,|:–—-]+|[\s,|:–—-]+$/g,''),u[0]);continue}
    add(l.split('\t')[0],'')}
  return items}
const looksLikeList=t=>{const ls=t.split(/\r?\n/).filter(x=>x.trim());return ls.length>=3&&(ls.filter(l=>/https?:\/\//.test(l)).length>=2||ls.filter(l=>/^\s*([-*•+]|\d+[.)])\s/.test(l)).length>=3||/<a\s[^>]*href/i.test(t))};

      L.overlaps=(r.overlaps||[]).map(o=>({items:(o.items||[]).map(id).filter(Boolean),shared:o.shared,advice:o.advice})).filter(o=>o.items.length>1);
      L.items.forEach(x=>{delete x.dup;delete x.covered});
      (r.duplicates||[]).forEach(d=>{const a=id(d[0]),b=id(d[1]);const xb=L.items.find(x=>x.id===b);if(a&&xb)xb.dup=a});
      (r.covered||[]).forEach(c=>{const x=L.items[+c.i];if(x)x.covered=c.track});

- Look: crisp, modern, readable, generous spacing, one accent colour drawn from the subject, light and dark via prefers-color-scheme, works at 360px wide. System fonts or one Google Font.
- Self-contained: inline CSS and JS. Only if truly needed, libraries from https://cdn.jsdelivr.net/npm/ or https://cdnjs.cloudflare.com (e.g. KaTeX for maths, d3). No other network access, no localStorage, no alert/confirm.
- Keep it under about 600 lines, complete and working: every button wired, no placeholders.
Return ONLY the HTML document, starting with <!DOCTYPE html>.`;
  let html='';
  for(let i=0;i<2&&!html;i++){
    const r=await sample(i?prompt+'\nYour previous attempt was cut off. Keep it under 400 lines.':prompt,{modelTier:'complex',cache:false,onText:({text})=>{prog(`Building your workspace (${Math.round(text.length/1000)}k written)`)}});
    const tx=r.text||'',a=tx.search(/<!DOCTYPE html>|<html/i),b=tx.lastIndexOf('</html>');
    if(a>=0&&b>a&&!r.truncated)html=tx.slice(a,b+7)}
  if(!html)throw new Error('The workspace came out incomplete. Say “rebuild the workspace” to try again.');
  t.envV=(t.envV||0)+1;
  if(assets){try{t.envId=(await assets.upload(new Blob([html],{type:'text/plain'}),{type:'text/plain'})).id;delete t.env}catch(e){t.env=html}}else t.env=html;
  saveT(t);return html}
async function envHTML(t){if(t.envId){const r=await fetch('/_blob/'+t.envId);if(r.ok)return r.text()}return t.env||null}
async function openEnv(t,rebuildNote){
  clearInterval(tick);cur={ws:t};newCard();const c=cardEl;c.classList.add('ws');
  const head=()=>`<div class="meta"><span class="chip">Workspace</span><span>${esc(t.title)}</span><span class="why">${t.units.filter(u=>u.status!=='new').length}/${t.units.length} milestones</span><div class="tools"><button type="button" class="btn ghost sm" data-a="wsFull">Full screen</button><button type="button" class="btn ghost sm" data-a="back">Close</button></div></div>`;
  c.innerHTML=head()+`<div class="load"><p class="dots" id="wsl">Opening your workspace</p></div>`;
  const prog=m=>{const l=c.querySelector('#wsl');if(l)l.textContent=m};
  try{let html=rebuildNote?null:await envHTML(t);if(!html)html=await spawnEnv(t,prog,rebuildNote);if(cur.ws!==t)return;
    const inj=BRIDGE.replace('__STATE__',()=>JSON.stringify(t.envState||null).replace(/</g,'\\u003c')).replace('__MS__',()=>JSON.stringify(t.units.map(u=>({title:u.title,goal:u.goal,done:u.status!=='new',score:u.last&&u.last.score}))).replace(/</g,'\\u003c'));
    const doc=/<head[^>]*>/i.test(html)?html.replace(/<head[^>]*>/i,m=>m+inj):inj+html;
    c.innerHTML=head();const f=document.createElement('iframe');f.className='wsf';f.title='Workspace for '+t.title;f.setAttribute('sandbox','allow-scripts allow-forms allow-modals');f.srcdoc=doc;c.append(f);wsFrame=f;wsTrack=t}
  catch(e){c.innerHTML=head()+`<p style="padding:16px">${esc(e.message||'Could not build the workspace.')}</p>`}}
let wsSaveT=null;
addEventListener('message',async e=>{
  if(!wsFrame||e.source!==wsFrame.contentWindow)return;const d=e.data||{},t=wsTrack,reply=v=>wsFrame&&wsFrame.contentWindow&&wsFrame.contentWindow.postMessage({slr:1,id:d.id,value:v},'*');
  try{
    if(d.sl==='run'){const a=d.args||{};try{reply(await runTests(String(a.code||''),Array.isArray(a.tests)?a.tests:[],a.viz||''))}catch(err){reply({setup:err.message,tests:[],stdout:'',viz:null})}}
    else if(d.sl==='ask'){if(++wsAsks>80){reply('Limit reached for this session.');return}
      try{const r=await sample(`${ctx(t.kind)}\nYou are the tutor inside the learner's workspace for "${t.title}". Be precise and brief.\n\n${String(d.args&&d.args.p||'').slice(0,12000)}`,{modelTier:'default',cache:false});reply(r.text||'')}catch(err){reply('Error: '+(err.message||err.code||'failed'))}}
    else if(d.sl==='fig'){const k=+(d.args&&d.args.k),f=(t.figs||[]).find(x=>x.n===k);if(!f){reply(null);return}const b=await figBlob(f);if(!b){reply(null);return}const fr=new FileReader;fr.onload=()=>reply(fr.result);fr.readAsDataURL(b)}
    else if(d.sl==='save'){const s=JSON.stringify(d.args||null);if(s.length<60000){t.envState=d.args;clearTimeout(wsSaveT);wsSaveT=setTimeout(()=>saveT(t),1500)}}
    else if(d.sl==='progress'){const a=d.args||{},u=t.units[+a.m];if(!u)return;const sc=Math.max(0,Math.min(100,+a.score||0)),now=Date.now();
      const rating=sc>=90?'easy':sc>=75?'good':sc>=50?'hard':'again',wasNew=u.status==='new';
      u.interval=rating==='again'?0:rating==='hard'?1:rating==='good'?2:4;u.due=now+(rating==='again'?10*60e3:u.interval*D);u.status='learning';u.reps=(u.reps||0)+1;u.last={rating,score:sc,at:now};t.touched=now;
      P.log.push({at:now,kind:t.kind,unit:u.title,fmt:'workspace',rating,score:sc,note:String(a.note||'').slice(0,200)});P.log=P.log.slice(-60);
      const day=new Date().toDateString();if(P.day!==day){P.day=day;P.today=0}P.today++;P.done++;
      saveT(t);saveP();renderStat();if(P.log.length%(P.log.length<15?3:5)===0)refreshModel();
      if(sc>=75&&wasNew){const nx=t.units.findIndex(x=>x.status==='new');say(`<p class="why">Milestone done: <b>${esc(u.title)}</b> (${sc}). ${nx<0?'That was the last one. I’ll bring the key ideas back for review on schedule.':'Next: '+esc(t.units[nx].title)+'.'}</p>`)}}
  }catch(err){}});

/* ---------- the teacher: understands whatever you type ---------- */
async function send(){const m=$('#msg'),txt=m.value.trim();if(!txt&&!pending)return;m.value='';m.style.height='';
  if(pending){say(esc(txt)+(txt?'\n':'')+'[captured: '+esc(pending.title||pending.url)+']','me');return addTrack(txt)}
  say(esc(txt),'me');
  if(looksLikeList(txt))return importList(txt);
  if(/^https?:\/\/\S+$/.test(txt))return addTrack(txt);
  if(/^(next|keep going|go|continue|more)\.?$/i.test(txt)){skipped.clear();return next()}
  if(/^skip\.?$/i.test(txt)){if(cur&&cur.u)skipped.add(cur.u.id);return next()}
  route(txt)}
async function route(txt){const w=say('<p class="dots">Thinking</p>');
  try{const it=cur&&cur.item;const r=await ask(`You are the learner's personal teacher inside Study Loop: warm, brief, direct. You decide what happens next.
${ctx()}
CURRENTLY OPEN WORKSPACE: ${cur&&cur.ws?cur.ws.id+' '+cur.ws.title:'none'}
TRACKS: ${JSON.stringify(T.map(t=>({id:t.id,title:t.title,kind:t.kind,started:t.units.filter(u=>u.status!=='new').length,units:t.units.length})))}
LIBRARY CLUSTERS: ${JSON.stringify(L.clusters.map(c=>({id:c.id,name:c.name,items:c.items.length})))}
CURRENT EXERCISE: ${cur&&cur.u?JSON.stringify({unit:cur.u.title,goal:cur.u.goal,format:cur.u.format,content:it}).slice(0,6000):'none'}
FORMATS: ${Object.keys(FMT).join(', ')}
LEARNER SAYS: """${txt}"""
Pick ONE action:
- learn: they want to learn something new ("topic" = what, with every detail they gave)
- next: move on / give me something
- skip: skip the current exercise
- switch: redo the current exercise in another format ("format")
- feedback: they tell you how they want to be taught ("note" = a crisp standing instruction for future exercises; set "format" too if it implies changing the current one)
- progress: they ask what they're learning, how they're doing, or what's due
- read: they want to read a saved source ("trackId")
- focus: they want to study a specific track now ("trackId")
- delete: they explicitly ask to remove a track ("trackId")
- library: they want to see their imported list / reading list / library map
- cluster: they want to start learning one library cluster ("clusterId")
- organize: they ask to (re)organize their library
- workspace: they want to open the interactive workspace for a track ("trackId"; default the current or most recent track)
- rebuild: they want the workspace rebuilt or changed ("trackId", "note" = exactly what to change)
- help: they ask about or answer the current exercise; help Socratically in "say" (no full solution unless they ask for it)
- chat: anything else
Return ONLY JSON: {"action":"","say":"1-3 sentences, plain words","topic":"","format":"","trackId":"","clusterId":"","note":""}`,'quick');
    w.innerHTML=md(r.say||'');if(!r.say)w.remove();
    const t=T.find(x=>x.id===r.trackId);
    switch(r.action){
      case 'learn':return addTrack(r.topic||txt);
      case 'next':skipped.clear();return next();
      case 'skip':if(cur&&cur.u)skipped.add(cur.u.id);return next();
      case 'switch':if(cur&&cur.u&&FMT[r.format])switchFmt(r.format);return;
      case 'feedback':if(r.note){P.asks=[...(P.asks||[]),r.note].slice(-12);P.log.push({at:Date.now(),note:r.note});saveP();refreshModel()}
        if(cur&&cur.u&&FMT[r.format]&&r.format!==cur.u.format)switchFmt(r.format);return;
      case 'progress':say(progressHTML());return;
      case 'library':say(libraryHTML(),'t lib');return;
      case 'cluster':{const c=L.clusters.find(x=>x.id===r.clusterId);if(c)learnCluster(c);return}
      case 'organize':L.stale=true;organize();return;
      case 'workspace':{const tt=t||(cur&&(cur.ws||cur.t))||T[T.length-1];if(tt)openEnv(tt);return}
      case 'rebuild':{const tt=t||(cur&&(cur.ws||cur.t))||T[T.length-1];if(tt){if(r.note){P.asks=[...(P.asks||[]),'Workspaces: '+r.note].slice(-12);saveP()}openEnv(tt,r.note||'Make it better.')}return}
      case 'read':if(t)openReader(t);return;
      case 'focus':if(t)focus(t);return;
      case 'delete':if(t)say(`<p>Delete <b>${esc(t.title)}</b> and its saved progress?</p><div class="row"><button type="button" class="btn sm" data-a="del" data-t="${t.id}" data-sure="1">Delete it</button></div>`);return;
    }
  }catch(e){w.innerHTML=`<p>${esc(e.message||'Something went wrong. Try again.')}</p>`}}

/* ---------- events ---------- */
$('#att').onclick=()=>$('#file').click();

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,it=cur&&cur.item;
  if(a==='copybm'){try{await navigator.clipboard.writeText('javascript:'+encodeURIComponent(BM));b.textContent='Copied'}catch(err){status('Copy was blocked here; drag the yellow button instead.')}return}
  if(a==='unpend'){pending=null;showPending();return}

  if(a==='study'){const t=T.find(x=>x.id===b.dataset.t);if(t)focus(t);return}
  if(a==='read'){const t=T.find(x=>x.id===b.dataset.t);if(t)openReader(t);return}

  if(a==='wsFull'){b.closest('.card').classList.toggle('full');b.textContent=b.closest('.card').classList.contains('full')?'Exit full screen':'Full screen';return}
  if(a==='del'){const t=T.find(x=>x.id===b.dataset.t);if(!t)return;if(!b.dataset.sure&&!t._c){t._c=1;b.textContent='Confirm delete';setTimeout(()=>{delete t._c;if(b.isConnected)b.textContent='Delete'},4000);return}
    const row=b.closest('.tr');if(row)row.remove();else b.parentNode.innerHTML='<span class="why">Deleted.</span>';
    T=T.filter(x=>x!==t);lsSave();if(col)col.doc('t_'+t.id).delete().catch(()=>{});
    if(assets){for(const id of [...(t.figs||[]).map(f=>f.id),t.htmlId,t.envId].filter(Boolean))assets.delete(id).catch(()=>{})}
    if(cur&&(cur.t===t||cur.reader===t))next();else renderStat();return}
  if(a==='skip'){skipped.add(cur.u.id);next();return}
  if(a==='retry'){load([cur.t,cur.u]);return}
  if(a==='rate'){cur.rating=b.dataset.v;finish('');return}
  if(a==='alt'){cur.alt=cur.alt===b.dataset.v?null:b.dataset.v;b.parentNode.querySelectorAll('.pick').forEach(x=>x.classList.toggle('on',x.dataset.v===cur.alt));return}
  if(a==='timer'){clearInterval(tick);const end=Date.now()+(+b.dataset.m)*6e4,el=$('#tm');b.textContent='Restart';
    tick=setInterval(()=>{if(!document.body.contains(el)){clearInterval(tick);return}const s=Math.round((end-Date.now())/1e3),A=Math.abs(s);el.textContent=(s<0?'+':'')+Math.floor(A/60)+':'+String(A%60).padStart(2,'0');el.classList.toggle('late',s<0)},500);return}
  if(a==='ans'){const q=it.questions[+b.dataset.q],c=+b.dataset.c,box=b.parentNode;if(box.dataset.done)return;box.dataset.done=1;
    box.querySelectorAll('.opt').forEach((x,j)=>{if(j===+q.answer)x.classList.add('ok');else if(j===c)x.classList.add('no')});
    $('#why'+b.dataset.q).innerHTML=md(q.why);cur.qs=(cur.qs||0)+(c===+q.answer?1:0);cur.score=Math.round(100*cur.qs/it.questions.length);return}
  if(a==='flip'){cur.flip=1;drawFC();return}
  if(a==='fcY'||a==='fcN'){if(a==='fcY')cur.hit++;cur.fi++;cur.flip=0;drawFC();return}
  if(a==='hint'){cur.h=cur.h||0;const hs=it.hints||[];if(cur.h<hs.length){$('#hints').insertAdjacentHTML('beforeend',`<div class="primer">${md(hs[cur.h])}</div>`);cur.h++}else b.disabled=true;return}
  if(a==='runT'){autoRun(true);return}
  if(a==='sol'){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Reveal? (caps score at 50)';return}cur.peeked=true;$('#hints').insertAdjacentHTML('beforeend',`<details open class="nudge"><summary>Reference solution</summary><pre><code>${esc(it.reference||'Not available.')}</code></pre></details>`);b.remove();return}
  if(a==='copy'){try{await navigator.clipboard.writeText(getCode());b.textContent='Copied'}catch(err){$('#ed').select()}return}
  if(a==='nb'){const code=getCode()+(cur.u.format==='code'&&Array.isArray(it.tests)?'\n\n# ---- tests ----\n'+it.tests.map(t=>`# ${t.name}\n${t.code}`).join('\n\n')+"\nprint('ALL TESTS PASSED')":'');const name=(it.title||'assignment').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.ipynb';
    try{await downloads.save({filename:name,data:notebook(it.title||'Assignment',(it.paper?'**Paper:** '+it.paper+'\n\n':'')+(it.brief||''),code)})}catch(err){status('Download was declined or blocked. Use Copy code and paste into a Colab cell.')}return}
  if(a==='run'){const o=$('#out');b.disabled=true;o.textContent=pyP?'Running…':'Loading Python (first run takes ~10 s)…';
    try{const r=await runPy($('#ed').value+'\n\n'+it.tests);o.textContent=r;if(/ALL TESTS PASSED/.test(r))cur.score=100;else cur.score=cur.score??0}

(async()=>{

        if(pp||tp.length){P=Object.assign(P,pp||{});T=tp.sort((a,b)=>a.created-b.created);lsSave()}else if(T.length){saveP();T.forEach(saveT)}if(!ll&&L.items.length)saveL();

})();
